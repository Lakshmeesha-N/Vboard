[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vboard-backend"
version = "0.1.0"
description = "Speak how you think. Type how you want."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "huggingface-hub>=0.25.0",
    "loguru>=0.7.2",
    "python-multipart>=0.0.12",
    "jiwer>=3.0.0",
]

[project.scripts]
eval-audio = "scripts.eval_audio:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
]
eval = [
    "datasets>=2.20.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
